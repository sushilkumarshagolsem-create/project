<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch" />
    <title>Contact · Hello, World!</title>
    <style>
      :root { color-scheme:dark; --ink:#f7f8ff; --muted:#b8bdd7; --violet:#8b5cf6; --cyan:#22d3ee; } * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:#090b19; }
      .orb { position:fixed; width:32rem; height:32rem; border-radius:50%; filter:blur(70px); opacity:.32; pointer-events:none; animation:drift 12s ease-in-out infinite alternate; }.orb-one { background:var(--violet); top:-14rem; left:-10rem; }.orb-two { background:var(--cyan); right:-12rem; bottom:-16rem; animation-delay:-5s; }
      main { position:relative; width:min(92vw,720px); padding:4.5rem 3rem; border:1px solid rgba(255,255,255,.16); border-radius:28px; background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035)); box-shadow:0 28px 80px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.14); backdrop-filter:blur(18px); animation:appear .8s cubic-bezier(.2,.8,.2,1) both; }
      nav { position:absolute; top:1.25rem; right:1.5rem; display:flex; gap:1rem; }nav a { color:var(--muted); font-size:.9rem; font-weight:700; text-decoration:none; transition:color .2s ease; }nav a:hover,nav a[aria-current="page"] { color:white; }.eyebrow { margin:0 0 .7rem; color:var(--cyan); font-size:.76rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }h1 { margin:0; font-size:clamp(2.7rem,7vw,4.8rem); letter-spacing:-.06em; background:linear-gradient(105deg,#fff 20%,#d8d5ff 52%,#8ceaf6); -webkit-background-clip:text; background-clip:text; color:transparent; }p { color:var(--muted); font-size:1.08rem; line-height:1.7; }
      form { display:grid; gap:1rem; margin-top:1.5rem; } label { color:#e8e9f5; font-size:.9rem; font-weight:700; } input,textarea { width:100%; margin-top:.4rem; padding:.85rem 1rem; border:1px solid rgba(255,255,255,.16); border-radius:12px; outline:0; color:white; font:inherit; background:rgba(6,8,24,.45); } input:focus,textarea:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.16); } textarea { min-height:105px; resize:vertical; } button { justify-self:start; padding:.85rem 1.25rem; border:0; border-radius:999px; color:#0b1020; font:inherit; font-weight:800; cursor:pointer; background:linear-gradient(105deg,#d9d4ff,var(--cyan)); transition:transform .2s ease; } button:hover { transform:translateY(-3px); } #confirmation { min-height:1.4em; margin:0; color:var(--cyan); font-weight:700; font-size:.95rem; }
      @keyframes appear { from { opacity:0; transform:translateY(22px) scale(.97); } to { opacity:1; transform:none; } }@keyframes drift { to { transform:translate(70px,45px) scale(1.1); } } @media(max-width:520px) { main { padding:4rem 1.5rem 2.5rem; border-radius:22px; } }@media(prefers-reduced-motion:reduce) { * { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div><div class="orb orb-two"></div>
    <main>
      <nav aria-label="Main navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <p class="eyebrow">Let’s connect</p><h1>Say hello.</h1>
      <p>Have an idea, a question, or just want to wave? Leave a note below.</p>
      <form id="contact-form">
        <label>Name<input required name="name" autocomplete="name" placeholder="Your name" /></label>
        <label>Email<input required type="email" name="email" autocomplete="email" placeholder="you@example.com" /></label>
        <label>Message<textarea required name="message" placeholder="What’s on your mind?"></textarea></label>
        <button type="submit">Send message →</button><p id="confirmation" aria-live="polite"></p>
      </form>
    </main>
    <script>document.querySelector('#contact-form').addEventListener('submit', event => { event.preventDefault(); event.currentTarget.reset(); document.querySelector('#confirmation').textContent = 'Thanks! Your message is ready to be sent.'; });</script>
  </body>
</html>
